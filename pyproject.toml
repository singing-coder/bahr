[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taqti"
version = "0.1.0"
description = "Urdu-Hindi meter identification and scansion (arūz), after Pritchett & Khaliq's Urdu Meter: A Practical Handbook"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.optional-dependencies]
webapp = ["streamlit>=1.30"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["taqti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
